<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Laps in Traffic</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --bg: #f2f2f0;
    --ink: #1c1c1c;
    --muted: #6b6b6b;
    --track-status: #f2c744;
  }
  body {
    background: var(--bg);
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    margin: 0;
    padding: 24px;
  }
  h1 {
    font-size: 26px;
    margin: 0 0 4px 0;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 16px;
  }
  .axis text {
    fill: var(--muted);
    font-size: 12px;
  }
  .axis path, .axis line {
    stroke: #cfcabc;
  }
  .driver-label {
    font-size: 13px;
    font-weight: 700;
    dominant-baseline: middle;
  }
  .cell-label {
    font-size: 10px;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }
  .cell-label.track-status {
    font-weight: 700;
  }
  #status {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 8px;
  }
  #legend {
    font-size: 13px;
    color: var(--muted);
    margin-top: 14px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
  }
  #legend .item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  #legend .swatch {
    width: 14px;
    height: 14px;
    display: inline-block;
    border: 1px solid #999;
  }
  #legend-gradient {
    display: block;
  }
</style>
</head>
<body>

  <h1>Laps in traffic</h1>
  <div class="subtitle">% de cada vuelta con gap &lt; 2s al auto de adelante</div>

  <div id="status"></div>
  <svg id="chart"></svg>

  <div id="legend">
    <span class="item">% de vuelta en tráfico:</span>
    <svg id="legend-gradient" width="220" height="34"></svg>
    <span class="item"><span class="swatch" style="background:var(--track-status)"></span>SC / VSC / bandera (Y, SC, VSC, R)</span>
  </div>

<script>
// ---------------------------------------------------------------
// Esta página vive embebida en un <iframe> dentro del frontend base
// (dashboard/templates/dashboard/base.html), igual que pace_by_stint.html.
// A diferencia de pace_by_stint, este módulo no tiene controles propios en
// el menú del frontend base: no hay filtros que ajustar, así que no hace
// falta escuchar mensajes "update-filters" ni notificar pilotos/estado al
// padre. Solo se necesitan race_id y api_base por query param.
// ---------------------------------------------------------------

// ---------------------------------------------------------------
// Paleta de colores por equipo (fallback a escala ordinal si no matchea).
// Misma paleta que pace_by_stint.html para mantener consistencia visual
// entre módulos del dashboard.
// ---------------------------------------------------------------
const TEAM_COLORS = {
  "Red Bull Racing": "#3671C6",
  "Red Bull": "#3671C6",
  "Ferrari": "#E8002D",
  "Mercedes": "#27F4D2",
  "McLaren": "#FF8000",
  "Aston Martin": "#229971",
  "Alpine": "#00A1E8",
  "Williams": "#64C4FF",
  "RB": "#6692FF",
  "Racing Bulls": "#6692FF",
  "Kick Sauber": "#52E252",
  "Sauber": "#52E252",
  "Audi": "#9B0000",
  "Haas": "#B6BABD",
  "Cadillac": "#8B6F47",
};
const fallbackColorScale = d3.scaleOrdinal(d3.schemeTableau10);

function teamColor(teamName) {
  return TEAM_COLORS[teamName] || fallbackColorScale(teamName);
}

// Color fijo para vueltas bajo SC/VSC/bandera (track_status_label presente).
const TRACK_STATUS_COLOR = "#f2c744";

// Escala de color de las celdas normales: blanco (0%) -> rojo oscuro (100%).
const cellColor = d3.scaleSequential(d3.interpolateReds).domain([0, 100]);

// Umbral de luminosidad de la celda a partir del cual el texto pasa a
// blanco para mantener contraste legible sobre el rojo oscuro.
const DARK_TEXT_THRESHOLD_PCT = 55;

function cellTextColor(pct) {
  return pct > DARK_TEXT_THRESHOLD_PCT ? "#f5f1e8" : "#1c1c1c";
}

function formatPct(pct) {
  if (pct > 90) return ">90%";
  return `${Math.round(pct)}%`;
}

// ---------------------------------------------------------------
// Estado: datos crudos del último race_id cargado.
// ---------------------------------------------------------------
let apiBase = "http://127.0.0.1:8000";
let raceId = null;

// ---------------------------------------------------------------
// Orden de pilotos: el backend (analytics/modules/laps_in_traffic.py) no
// expone posición final de carrera, así que se usa como aproximación la
// cantidad de vueltas con dato (traffic_pct o track_status) descendente —
// quien completó más vueltas queda más arriba, como proxy de la
// clasificación real. No es exactamente el orden de llegada del gráfico
// de referencia.
// ---------------------------------------------------------------
function sortDrivers(drivers) {
  return [...drivers].sort((a, b) => b.laps.length - a.laps.length);
}

function drawLegend() {
  const svg = d3.select("#legend-gradient");
  svg.selectAll("*").remove();

  const gradientId = "traffic-gradient";
  const defs = svg.append("defs");
  const gradient = defs.append("linearGradient").attr("id", gradientId);

  d3.range(0, 101, 10).forEach((pct) => {
    gradient.append("stop")
      .attr("offset", `${pct}%`)
      .attr("stop-color", cellColor(pct));
  });

  svg.append("rect")
    .attr("x", 0).attr("y", 0)
    .attr("width", 200).attr("height", 14)
    .attr("fill", `url(#${gradientId})`)
    .attr("stroke", "#999");

  [0, 20, 40, 60, 80, 100].forEach((pct) => {
    svg.append("text")
      .attr("x", (pct / 100) * 200)
      .attr("y", 28)
      .attr("font-size", 10)
      .attr("text-anchor", pct === 0 ? "start" : pct === 100 ? "end" : "middle")
      .attr("fill", "#6b6b6b")
      .text(`${pct}%`);
  });
}

function drawChart(drivers, maxLap) {
  const cellWidth = 34;
  const cellHeight = 30;
  const margin = { top: 30, right: 30, bottom: 40, left: 90 };

  const width = maxLap * cellWidth;
  const height = drivers.length * cellHeight;

  const svg = d3.select("#chart")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom);

  svg.selectAll("*").remove();
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const x = d3.scaleLinear().domain([1, maxLap + 1]).range([0, width]);
  const y = d3.scaleBand().domain(drivers.map((d) => d.driver)).range([0, height]);

  // Eje superior/inferior: número de vuelta cada 5 (1, 5, 10, 15, ...), igual
  // que el gráfico de referencia.
  const lapTicks = [1, ...d3.range(5, maxLap + 1, 5)];

  g.append("g")
    .attr("class", "axis")
    .call(d3.axisTop(x).tickValues(lapTicks).tickFormat(d3.format("d")).tickSize(0))
    .call((sel) => sel.select(".domain").remove());

  g.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(0,${height})`)
    .call(d3.axisBottom(x).tickValues(lapTicks).tickFormat(d3.format("d")).tickSize(0))
    .call((sel) => sel.select(".domain").remove());

  // --- Etiquetas de piloto, coloreadas por equipo ---
  g.selectAll(".driver-label")
    .data(drivers)
    .enter()
    .append("text")
    .attr("class", "driver-label")
    .attr("x", -10)
    .attr("y", (d) => y(d.driver) + y.bandwidth() / 2)
    .attr("text-anchor", "end")
    .attr("fill", (d) => teamColor(d.team))
    .text((d) => d.driver);

  // --- Celdas del heatmap ---
  // Una celda por vuelta con dato disponible: traffic_pct (escala roja) o
  // track_status_label (amarillo fijo, vuelta bajo SC/VSC/bandera). Las
  // vueltas sin ninguno de los dos (telemetría insuficiente) ya vienen
  // descartadas desde el backend y quedan como hueco en blanco.
  drivers.forEach((driver) => {
    const row = g.append("g");

    driver.laps.forEach((lap) => {
      const cx = x(lap.lap);
      const cy = y(driver.driver);
      const isTrackStatus = lap.track_status_label !== null && lap.track_status_label !== undefined;

      row.append("rect")
        .attr("x", cx)
        .attr("y", cy)
        .attr("width", cellWidth - 1)
        .attr("height", cellHeight - 1)
        .attr("fill", isTrackStatus ? TRACK_STATUS_COLOR : cellColor(lap.traffic_pct));

      row.append("text")
        .attr("class", isTrackStatus ? "cell-label track-status" : "cell-label")
        .attr("x", cx + (cellWidth - 1) / 2)
        .attr("y", cy + (cellHeight - 1) / 2)
        .attr("fill", isTrackStatus ? "#1c1c1c" : cellTextColor(lap.traffic_pct))
        .text(isTrackStatus ? lap.track_status_label : formatPct(lap.traffic_pct));
    });
  });
}

// ---------------------------------------------------------------
// Carga de datos (se dispara una sola vez, al recibir race_id por query param)
// ---------------------------------------------------------------
async function loadAndRender() {
  const statusEl = document.getElementById("status");
  statusEl.textContent = "Cargando datos...";

  let payload;
  try {
    const res = await fetch(`${apiBase}/api/analysis?module=laps_in_traffic&race_id=${raceId}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    payload = await res.json();
  } catch (err) {
    statusEl.textContent = `Error al cargar datos: ${err.message}. Verificá CORS_ALLOWED_ORIGINS en el backend.`;
    return;
  }

  if (!payload.data || payload.data.length === 0) {
    statusEl.textContent = "El módulo no devolvió vueltas con dato de tráfico (¿race_id correcto? ¿se corrió load_fastf1?).";
    return;
  }

  statusEl.textContent = "";

  const drivers = sortDrivers(payload.data);
  drawLegend();
  drawChart(drivers, payload.max_lap);
}

// ---------------------------------------------------------------
// Integración con el frontend base (dashboard).
// Esta página siempre se carga embebida vía iframe con ?race_id=...&api_base=...
// ---------------------------------------------------------------
(function initFromQueryParams() {
  const params = new URLSearchParams(window.location.search);
  const raceIdParam = params.get("race_id");
  const apiBaseParam = params.get("api_base");

  if (apiBaseParam) {
    apiBase = apiBaseParam;
  }
  if (raceIdParam) {
    raceId = raceIdParam;
    loadAndRender();
  }
})();
</script>
</body>
</html>
